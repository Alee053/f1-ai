[project]
name = "f1-ai"
version = "0.1.0"
description = "Evaluación de un agente PPO en carreras 2D para SIS-252"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium[box2d]==1.2.3",
    "numpy>=2.1,<3",
    "stable-baselines3==2.7.1",
    "torch>=2.3,<3",
    "matplotlib>=3.9,<4",
    "pygame==2.6.1",
]

[project.scripts]
f1-ai = "f1_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
